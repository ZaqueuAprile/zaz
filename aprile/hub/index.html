<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub Aprile · Protótipo</title>
<meta name="description" content="Protótipo do Hub Aprile: cardápio, guia, gestão, operação e clientes do seu negócio num só lugar.">
<meta name="theme-color" content="#1a1814">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f1;--panel:#fff;--sand:#f3eee3;--fg:#1a1814;--muted:#6b6458;--line:#e4dccb;
  --gold:#a8800f;--gold-light:#d4af37;--dark:#1a1814;--on-dark:#f5efe2;--on-dark-muted:#a79f90;--line-dark:#3a3222;
  --ok:#2f7d4f;--warn:#b7791f;--bad:#b4412f;--s1:#2a78d6;
  --serif:"Lora",Georgia,serif;--sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.01em;line-height:1.15}

/* faixa do protótipo */
.demo{background:var(--dark);color:var(--on-dark-muted);font-size:13px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:7px 14px}
.demo b{color:var(--on-dark);font-weight:600}
.demo .sw{display:inline-flex;border:1px solid var(--line-dark);border-radius:6px;overflow:hidden}
.demo .sw button{padding:3px 10px;color:var(--on-dark-muted);font-size:12.5px}
.demo .sw button[aria-pressed="true"]{background:var(--on-dark);color:var(--fg)}
.demo a{color:var(--gold-light)}

/* estrutura */
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100dvh - 36px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100dvh - 36px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand img{width:38px}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.1}
.brand small{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:var(--sand);color:var(--fg)}
.nav[aria-current="page"]{background:var(--fg);color:#fff}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nav[aria-current="page"] .badge{background:#fff;color:var(--bad)}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me b{display:block;font-size:14px}
.me small{font-size:12px;color:var(--muted)}
main{padding:26px 32px 40px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:30px}
.head p{color:var(--muted);margin-top:2px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--fg);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn-dark{background:var(--fg);color:#fff}
.btn-dark:disabled{opacity:.35;cursor:default}
.btn-line{border-color:var(--line);background:#fff}
.btn-line:hover{border-color:var(--fg)}
.btn-sm{min-height:32px;padding:0 11px;font-size:13px}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em;margin:2px 0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi em{font-style:normal;font-weight:600}
.up{color:var(--ok)}.dn{color:var(--bad)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.card-h h3{font-family:var(--sans);font-size:15px;font-weight:600}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list b{font-weight:600}
.list small{display:block;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}.pill.info{color:var(--s1)}
.go{font-size:13px;font-weight:600;color:var(--gold);white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--fg);white-space:nowrap}
.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.sub td{font-weight:600;background:var(--sand)}
.t tr.res td{font-weight:700;border-top:2px solid var(--fg)}
.t td.ind{padding-left:24px;color:var(--muted)}
.scroll{overflow-x:auto}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;width:100%}
input.in.num{text-align:right}
.tgl{position:relative;width:38px;height:22px;border-radius:999px;background:#d6cfbf;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl[aria-checked="true"]{background:var(--ok)}
.tgl[aria-checked="true"]::after{transform:translateX(16px)}
.lang{display:inline-flex;gap:3px}
.lang span{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 5px;background:#e8f3ec;color:var(--ok)}
.lang span.no{background:#fbe9e6;color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{padding:6px 11px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff}

/* prévia no celular */
.ed{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.phone{width:290px;border-radius:36px;background:#0b0a08;padding:9px;position:sticky;top:16px}
.screen{border-radius:28px;overflow:hidden;height:560px;background:#fff;display:flex;flex-direction:column}
.p-top{padding:30px 14px 10px;background:#1a1814;color:#fff;display:flex;justify-content:space-between;align-items:end;flex:none}
.p-top b{font-size:15px;display:block}
.p-top small{font-size:11px;color:#bdb5a6}
.p-body{flex:1;overflow-y:auto;padding:4px 12px 14px;font-size:13px}
.p-cat{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin:12px 0 2px}
.p-dish{display:grid;grid-template-columns:48px 1fr;gap:9px;padding:8px 0;border-bottom:1px solid #f0ece5}
.p-dish i{width:48px;height:48px;border-radius:7px;display:block}
.p-dish b{font-size:13px;display:block}
.p-dish small{color:#777;font-size:11.5px;display:block;line-height:1.3}
.p-dish .pr{font-weight:600;font-size:12.5px}
.p-dish.off{opacity:.45}
.p-langs{display:flex;border:1px solid #4a4232;border-radius:6px;overflow:hidden}
.p-langs button{font-size:11px;padding:3px 6px;color:#bdb5a6}
.p-langs button[aria-pressed="true"]{background:#f5efe2;color:#1a1814;font-weight:700}
.g-it{padding:11px 0;border-bottom:1px solid #eee}
.g-it b{display:block;font-size:13.5px}
.g-it span{font-size:12.5px;color:#555}

/* quadro de pedidos */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sand);border-radius:10px;padding:10px;min-height:260px}
.col h4{font-size:13px;font-weight:700;margin:2px 4px 8px;display:flex;justify-content:space-between}
.order{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;font-size:13.5px;animation:pop .25s ease}
.order b{display:block}
.order small{color:var(--muted);display:block}
.order .btn{margin-top:8px;width:100%}
@keyframes pop{from{opacity:0;transform:translateY(4px)}}

/* quartos */
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.room{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:6px}
.room b{font-size:16px;font-family:var(--serif);font-weight:500}
.room small{color:var(--muted);font-size:12.5px}
.room.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}

/* gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:220px;overflow:visible}
.chart .ax{font-size:11px;fill:#8c8476}
.chart .grid{stroke:#ece5d6}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:rgba(26,24,20,.05)}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(26,24,20,.12);padding:7px 10px;font-size:12.5px;opacity:0;transition:opacity .1s;z-index:3;white-space:nowrap}
.tip.on{opacity:1}
.tip .d{color:var(--muted)}

/* diálogo e aviso */
dialog{margin:auto;border:0;border-radius:12px;padding:0;width:min(560px,calc(100% - 20px));max-height:calc(100dvh - 20px);background:var(--bg);color:var(--fg);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(26,24,20,.55)}
.dl-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dl-h h3{font-size:21px}
.dl-b{padding:16px 20px}
.dl-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);font-size:22px;line-height:1}
.fld{display:grid;gap:4px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.fld3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:80;background:var(--fg);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.msg{background:#d9fdd3;border-radius:8px;padding:10px 12px;font-size:14px;white-space:pre-line}

.bottom{display:none}
@media (max-width:1000px){
  .kpis{grid-template-columns:1fr 1fr}
  .two,.ed{grid-template-columns:1fr}
  .phone{position:static;margin:0 auto}
  .rooms{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:18px 16px 96px}
  .head h1{font-size:25px}
  .bottom{display:grid;grid-template-columns:repeat(var(--n),1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
  .bottom svg{width:22px;height:22px}
  .bottom button[aria-current="page"]{color:var(--fg);font-weight:700}
  .bottom .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
  .kpi b{font-size:20px}
  .t .hide-s{display:none}
  .fld3{grid-template-columns:1fr}
  .phone{width:min(290px,100%)}
  .toast{bottom:88px}
}
</style>
</head>

function dialog(title,body,foot){$("dlgT").textContent=title;$("dlgB").innerHTML=body;$("dlgF").innerHTML=foot||"";const d=$("dlg");if(!d.open)d.showModal();return $("dlgB")}

};
const ic=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ===== DADOS DE EXEMPLO ===== */
const BIZ={restaurante:"Restaurante Exemplo",pousada:"Pousada Exemplo"};
const NAVS={
 restaurante:[["inicio","Início"],["conteudo","Cardápio"],["gestao","Gestão"],["operacao","Operação"],["clientes","Clientes"],["conta","Conta"]],
 pousada:[["inicio","Início"],["conteudo","Guia e site"],["operacao","Quartos","quartos"],["clientes","Hóspedes"],["conta","Conta"]]
};
let aud="restaurante",view="inicio",sub={};
const S={
 dishes:[
  {c:"Entradas",n:{pt:"Bolinho de bacalhau",es:"Buñuelos de bacalao",en:"Salt cod fritters"},d:{pt:"8 unidades com aioli da casa.",es:"8 unidades con alioli.",en:"8 pieces with house aioli."},p:42,on:true,v:true,col:"#8a5a2b"},

  {c:"Pratos",n:{pt:"Camarão na moranga",es:"Camarones en calabaza",en:"Shrimp in pumpkin"},d:{pt:"Camarão cremoso servido na moranga.",es:"Camarones cremosos en calabaza.",en:"Creamy shrimp served in a pumpkin."},p:124,on:false,v:false,col:"#c4782a"},
  {c:"Pratos",n:{pt:"Picanha na brasa",es:"Picaña a la brasa",en:""},d:{pt:"300 g, farofa, vinagrete e mandioca.",es:"300 g, farofa, vinagreta y mandioca.",en:""},p:112,on:true,v:true,col:"#6b2f22"},
  {c:"Sobremesas",n:{pt:"Cocada de forno",es:"Cocada al horno",en:"Baked coconut sweet"},d:{pt:"Com sorvete de tapioca.",es:"Con helado de tapioca.",en:"With tapioca ice cream."},p:28,on:true,v:true,col:"#c49a52"},

  {t:{pt:"Passeio a Caraíva",es:"Paseo a Caraíva",en:"Caraíva tour"},x:{pt:"Dia inteiro, R$ 190 por pessoa.",es:"",en:"Full day, R$ 190 per person."},on:true},
  {t:{pt:"Recife de Fora",es:"Recife de Fora",en:"Recife de Fora"},x:{pt:"Mergulho na maré baixa, R$ 120 por pessoa.",es:"Buceo con marea baja, R$ 120 por persona.",en:"Snorkeling at low tide, R$ 120 per person."},on:true},
  {t:{pt:"Late check-out",es:"Late check-out",en:"Late check-out"},x:{pt:"Até 15h por R$ 120, conforme disponibilidade.",es:"Hasta las 15 h por R$ 120, según disponibilidad.",en:"Until 3 pm for R$ 120, subject to availability."},on:true}

function barChart(el,data,label){
  const W=el.clientWidth||600,H=220,pl=48,pr=8,pt=10,pb=24,mx=Math.max(...data.map(x=>x.v))*1.12,st=Math.pow(10,Math.floor(Math.log10(mx/4)))*(mx/4/Math.pow(10,Math.floor(Math.log10(mx/4)))>5?10:mx/4/Math.pow(10,Math.floor(Math.log10(mx/4)))>2?5:2),top=Math.ceil(mx/st)*st;
  const y=v=>pt+(H-pt-pb)*(1-v/top),bw=(W-pl-pr)/data.length,g=Math.min(14,bw*.3);let s="";
  for(let v=0;v<=top;v+=st)s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v>=1000?nf(v/1000)+" mil":nf(v)}</text>`;
  data.forEach((x,i)=>{const X=pl+i*bw+g/2,w=bw-g,r=Math.min(4,w/2);s+=`<path d="M${X},${y(0)} V${y(x.v)+r} q0,-${r} ${r},-${r} H${X+w-r} q${r},0 ${r},${r} V${y(0)} Z" fill="var(--s1)"/><text class="ax" x="${X+w/2}" y="${H-6}" text-anchor="middle">${x.l}</text><rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${s}</svg><div class="tip"></div>`;
  const tip=el.querySelector(".tip");el.querySelectorAll(".hit").forEach(h=>{h.onpointerenter=()=>{const x=data[+h.dataset.i];tip.innerHTML=`<div class="d">${x.f}</div><b>${brl(x.v)}</b>`;tip.classList.add("on");let l=(+h.getAttribute("x")+bw/2)*el.clientWidth/W+10;if(l+150>el.clientWidth)l-=170;tip.style.left=l+"px";tip.style.top="6px"};h.onpointerleave=()=>tip.classList.remove("on")});
}

function editTpl(k){
  const items=k?S.tpl[k].map(x=>x.slice()):[["","check"]];let name=k||"";
  const paint=()=>{const B=dialog(k?`Editar checklist · ${k}`:"Novo checklist",`<label class="fld">Nome do checklist<input class="in" id="tn" value="${esc(name)}" placeholder="Ex.: Abertura do bar"></label>
    <div class="scroll"><table class="t"><thead><tr><th>Item</th><th>Tipo</th><th class="r">Limite</th><th></th></tr></thead><tbody>${items.map((it,i)=>`<tr><td><input class="in" data-in="${i}" value="${esc(it[0])}" placeholder="Ex.: Freezer" style="min-width:140px"></td><td><select class="in" data-ty="${i}" style="width:130px"><option value="check" ${it[1]==="check"?"selected":""}>Marcar feito</option><option value="temp" ${it[1]==="temp"?"selected":""}>Temperatura</option></select></td><td class="r">${it[1]==="temp"?`<input class="in num" type="number" data-li="${i}" value="${it[2]??5}" style="width:70px"> °C`:'<span class="muted">—</span>'}</td><td class="r"><button class="go" data-rm="${i}" style="color:var(--bad)">Remover</button></td></tr>`).join("")}</tbody></table></div>
    <button class="btn btn-line btn-sm" id="tadd" style="margin-top:10px">+ Item</button><p class="muted" style="font-size:12.5px;margin-top:10px">Temperatura acima do limite gera alerta para o dono no Início.</p>`,`${k?'<button class="btn btn-line" id="tdel" style="margin-right:auto;color:var(--bad)">Excluir</button>':""}<button class="btn btn-line" id="tcancel">Cancelar</button><button class="btn btn-dark" id="tsave">Salvar</button>`);
    const read=()=>{name=$("tn").value.trim();items.forEach((it,i)=>{it[0]=B.querySelector(`[data-in="${i}"]`).value;it[1]=B.querySelector(`[data-ty="${i}"]`).value;const l=B.querySelector(`[data-li="${i}"]`);if(l)it[2]=+l.value})};
    B.querySelectorAll("[data-ty]").forEach(x=>x.onchange=()=>{read();paint()});
    B.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{read();items.splice(+x.dataset.rm,1);paint()});
    $("tadd").onclick=()=>{read();items.push(["","check"]);paint();$("dlgB").querySelector(`[data-in="${items.length-1}"]`).focus()};
    $("tcancel").onclick=()=>$("dlg").close();
    if(k)$("tdel").onclick=()=>{delete S.tpl[k];$("dlg").close();V.operacao();toast(`Checklist ${k} excluído`)};
    $("tsave").onclick=()=>{read();if(!name){toast("Dê um nome ao checklist");return}const ok=items.filter(x=>x[0].trim());if(!ok.length){toast("Inclua ao menos um item");return}
      if(k&&k!==name)delete S.tpl[k];S.tpl[name]=ok.map(x=>x[1]==="temp"?[x[0].trim(),"temp",x[2]??5]:[x[0].trim(),"check"]);$("dlg").close();V.operacao();toast(`Checklist ${name} salvo`)}};
  paint();
}

/* ===== FILA DE ESPERA (compartilhada entre abas) ===== */
const QK="aprile-hub-fila";
function qLoad(){try{const v=JSON.parse(localStorage.getItem(QK)||"null");if(v){S.queue=v.queue;S.limit=v.limit}}catch(e){}}
function qSave(){try{localStorage.setItem(QK,JSON.stringify({queue:S.queue,limit:S.limit}))}catch(e){}}
qLoad();
const mmss=s=>{const a=Math.abs(Math.round(s));return(s<0?"−":"")+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0")};
const left=q=>q.called?(q.called+q.lim*1000-Date.now())/1000:null;
function qAct(i,act){const q=S.queue[i];if(!q)return;
  if(act==="avisar"){q.st="avisado";q.called=Date.now();q.lim=S.limit;toast(`WhatsApp para ${q.n}: sua mesa está pronta`)}
  if(act==="sentou"){S.queue.splice(i,1);toast(`${q.n} sentou`)}
  if(act==="mais"){q.lim+=300;toast(`+5 minutos para ${q.n}`)}
  if(act==="passar"){q.pass=(q.pass||0)+1;q.st="esperando";q.called=null;
    if(q.pass>=3){S.queue.splice(i,1);toast(`${q.n} passou a vez 3 vezes e saiu da fila`)}
    else{S.queue.splice(i,1);S.queue.splice(Math.min(i+1,S.queue.length),0,q);toast(`${q.n} passou a vez (${q.pass} de 3) e foi para trás do próximo`)}}
  if(act==="sair"){S.queue.splice(i,1);toast(`${q.n} saiu da fila`)}
  qSave();refreshFila()}
function filaRows(big){
  if(!S.queue.length)return `<li class="muted" style="padding:20px 0">Fila vazia.</li>`;
  return S.queue.map((q,i)=>{const l=left(q),late=l!==null&&l<=0;
    return `<li class="${late?"late":""}" style="${late?"background:#fbe9e6;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:8px":""}"><span class="av" style="${big?"width:44px;height:44px;font-size:17px":""}">${i+1}</span><span class="grow"><b style="${big?"font-size:20px":""}">${esc(q.n)} · ${q.p} pessoas</b><small>Entrou ${q.at} · ${esc(q.t)}${q.pass?` · passou a vez ${q.pass} de 3`:""}</small></span>
    ${q.st==="avisado"?`<span class="num" data-timer="${i}" style="font-weight:700;font-size:${big?24:17}px;min-width:70px;text-align:right;color:${late?"var(--bad)":"var(--fg)"}">${mmss(l)}</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${late?`<button class="btn btn-line btn-sm" data-q="${i}" data-act="mais">+5 min</button><button class="btn btn-line btn-sm" data-q="${i}" data-act="passar">Passar a vez</button>`:""}<button class="btn btn-dark btn-sm" data-q="${i}" data-act="sentou">Sentou</button></span>`

function editRoomChk(q,done){
  const pad=q===null;let useDef=!pad&&!S.roomChk.custom[q];
  let items=(pad?S.roomChk.padrao:roomItems(q)).map(x=>x.slice());
  const others=S.rooms.map(r=>r[0]).filter(x=>x!==q);let apply=[];
  const paint=()=>{const B=dialog(pad?"Checklist padrão da pousada":`Checklist do quarto ${q}`,
    `${pad?`<p class="muted" style="font-size:13px;margin-bottom:10px">Vale para todos os quartos que não têm checklist próprio (${S.rooms.filter(r=>!S.roomChk.custom[r[0]]).map(r=>r[0]).join(", ")}).</p>`:`<label style="display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:12px"><button type="button" class="tgl" role="switch" id="rdef" aria-checked="${useDef}"></button> Usar o checklist padrão da pousada</label>`}
     ${useDef?`<ul class="list">${S.roomChk.padrao.map(([n,t])=>`<li><span class="grow">${esc(n)}</span><span class="pill mut">${t==="foto"?"foto":"marcar"}</span></li>`).join("")}</ul><p class="muted" style="font-size:12.5px;margin-top:8px">Desligue para montar um checklist só para este quarto.</p>`:
     `<div class="scroll"><table class="t"><thead><tr><th>Item</th><th>Tipo</th><th></th></tr></thead><tbody>${items.map((it,i)=>`<tr><td><input class="in" data-in="${i}" value="${esc(it[0])}" placeholder="Ex.: Hidromassagem higienizada" style="min-width:170px"></td><td><select class="in" data-ty="${i}" style="width:150px">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${k===it[1]?"selected":""}>${l}</option>`).join("")}</select></td><td class="r"><button class="go" data-rm="${i}" style="color:var(--bad)">Remover</button></td></tr>`).join("")}</tbody></table></div>
      <button class="btn btn-line btn-sm" id="radd" style="margin-top:10px">+ Item</button>
      ${pad?"":`<p style="margin-top:14px;font-size:13.5px;font-weight:600">Aplicar este checklist também aos quartos</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${others.map(o=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff"><input type="checkbox" data-ap="${o}" ${apply.includes(o)?"checked":""}> ${o}</label>`).join("")}</div>`}`}
     <p class="muted" style="font-size:12.5px;margin-top:12px">A camareira vê a lista atualizada ao ler o QR Code do quarto. Itens com foto só fecham com a foto tirada no celular.</p>`,
    `<button class="btn btn-line" id="rcancel">Cancelar</button><button class="btn btn-dark" id="rsave">Salvar</button>`);
    const read=()=>{if(useDef)return;items.forEach((it,i)=>{it[0]=B.querySelector(`[data-in="${i}"]`).value;it[1]=B.querySelector(`[data-ty="${i}"]`).value});apply=[...B.querySelectorAll("[data-ap]:checked")].map(x=>x.dataset.ap)};
    const t=$("rdef");if(t)t.onclick=()=>{read();useDef=!useDef;if(!useDef&&!items.length)items=S.roomChk.padrao.map(x=>x.slice());paint()};
    B.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{read();items.splice(+x.dataset.rm,1);paint()});
    const ad=$("radd");if(ad)ad.onclick=()=>{read();items.push(["","check"]);paint();$("dlgB").querySelector(`[data-in="${items.length-1}"]`).focus()};
    $("rcancel").onclick=()=>$("dlg").close();
    $("rsave").onclick=()=>{read();
      if(useDef){delete S.roomChk.custom[q];$("dlg").close();done();toast(`Quarto ${q} volta a usar o checklist padrão`);return}
      const ok=items.filter(x=>x[0].trim()).map(x=>[x[0].trim(),x[1]]);if(!ok.length){toast("Inclua ao menos um item");return}
      if(pad)S.roomChk.padrao=ok;else[q,...apply].forEach(r=>S.roomChk.custom[r]=ok.map(x=>x.slice()));
      $("dlg").close();done();toast(pad?"Checklist padrão atualizado":apply.length?`Checklist salvo nos quartos ${[q,...apply].join(", ")}`:`Checklist do quarto ${q} salvo`)}};
  paint();
}

   <label class="fld">Função<select class="in" id="sr">${Object.keys(R).map(r=>`<option ${r===u.r?"selected":""}>${r}</option>`).join("")}</select></label><p class="muted" id="sp" style="font-size:13px;margin:-4px 0 12px"></p>
   ${i<0?"":`<label style="display:flex;align-items:center;gap:10px;font-size:14px"><button type="button" class="tgl" role="switch" id="sa" aria-checked="${u.a}"></button> Acesso ativo</label>`}
   <p class="muted" style="font-size:12.5px;margin-top:12px">${i<0?"A pessoa recebe o link de acesso pelo WhatsApp e só vê o que a função permite.":"Pausar o acesso não apaga os registros que a pessoa já fez."}</p>`,
   `${i<0||u.r==="Dona"?"":'<button class="btn btn-line" id="sdel" style="margin-right:auto;color:var(--bad)">Remover</button>'}<button class="btn btn-line" id="scancel">Cancelar</button><button class="btn btn-dark" id="ssave">${i<0?"Cadastrar e enviar convite":"Salvar"}</button>`);
  const perm=()=>$("sp").textContent="Pode ver: "+R[$("sr").value];perm();$("sr").onchange=perm;
  const sa=$("sa");if(sa)sa.onclick=()=>sa.setAttribute("aria-checked",sa.getAttribute("aria-checked")!=="true");
  $("scancel").onclick=()=>$("dlg").close();
  const del=$("sdel");if(del)del.onclick=()=>{S.staff.splice(i,1);$("dlg").close();V.conta();toast(`${u.n} removido da equipe`)};
  $("ssave").onclick=()=>{const n=$("sn").value.trim();if(!n){toast("Digite o nome");return}
    const v={n,t:$("st").value.trim(),r:$("sr").value,a:sa?sa.getAttribute("aria-checked")==="true":true};
    if(i<0)S.staff.push(v);else S.staff[i]=v;$("dlg").close();V.conta();toast(i<0?`Convite enviado para ${n}`:`${n} atualizado`)};
}

/* início pelo endereço: #pousada/operacao */
const h=location.hash.match(/^#(restaurante|pousada)(?:\/([\w-]+))?/);
if(h&&h[2]==="fila-tela"){
  aud="restaurante";document.querySelector(".app").style.display="block";document.querySelector(".side").hidden=true;$("bottom").hidden=true;
  document.querySelector(".demo").innerHTML="<span><b>Fila de espera</b> · Restaurante Exemplo · tela da recepção</span><button type=\"button\" class=\"btn btn-sm\" style=\"background:#f5efe2;color:#1a1814\" onclick=\"document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()\">Tela cheia</button>";
  M().style.padding="18px 16px 40px";filaView(M(),true);
}else{
  if(h){aud=h[1];if(h[2]&&NAVS[aud].some(n=>n[0]===h[2]))view=h[2]}
  renderNav();V[view]();
}
addEventListener("resize",()=>{if(view==="gestao"&&(sub.gestao||"visao")==="visao")V.gestao()});
</script>
